<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio · 作品集</title>
  <style>
    /* ============================================================
       配色与变量 —— 照 the-brandidentity.com 案例页感觉
       米白底 + 近黑字 + 珊瑚红强调（站壳色调）
       ============================================================ */
    :root {
      --bg: #f5f5f3;
      --bg-alt: #efefea;
      --surface: #ffffff;
      --text: #0a0a0a;
      --text-soft: #5a5a55;
      --text-faint: #9a9a92;
      --line: #e2e2dc;
      --accent: #ff6a6a;       /* 珊瑚红 */
      --accent-soft: #b76341;  /* 陶土 */
      --accent-2: #5bbad5;     /* 天蓝 */
      --max-width: 1240px;
      --pad: clamp(20px, 5vw, 56px);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Helvetica Neue", "Inter", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    /* 滚动进度条 */
    .scroll-progress {
      position: fixed; top: 0; left: 0; height: 3px; width: 0;
      background: var(--accent); z-index: 200;
    }

    /* ============================================================
       导航 —— 极简（header--b 感觉）：左 wordmark / 右菜单
       ============================================================ */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 22px var(--pad);
      transition: background .35s ease, border-color .35s ease, padding .35s ease;
      border-bottom: 1px solid transparent;
    }
    .navbar.scrolled {
      background: rgba(255,255,255,.86);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      padding: 14px var(--pad);
    }
    .nav-logo {
      font-weight: 800; font-size: 20px; letter-spacing: -0.02em;
    }
    .nav-links {
      list-style: none; display: flex; gap: clamp(20px, 3vw, 40px); align-items: center;
    }
    .nav-links a {
      font-size: 13px; text-transform: uppercase; letter-spacing: .14em;
      color: var(--text-soft); font-weight: 600; position: relative; padding: 4px 0;
      transition: color .25s ease;
    }
    .nav-links a::after {
      content: ""; position: absolute; left: 0; bottom: 0; height: 1.5px; width: 0;
      background: var(--accent); transition: width .3s ease;
    }
    .nav-links a:hover { color: var(--text); }
    .nav-links a:hover::after { width: 100%; }
    .nav-toggle {
      display: none; flex-direction: column; gap: 5px; cursor: pointer; background: none; border: none;
    }
    .nav-toggle span { width: 26px; height: 2px; background: var(--text); transition: .3s; }

    /* ============================================================
       通用版式
       ============================================================ */
    .wrap { max-width: var(--max-width); margin: 0 auto; padding: 0 var(--pad); }
    .eyebrow {
      display: inline-block; font-size: 12px; font-weight: 700;
      letter-spacing: .2em; text-transform: uppercase; color: var(--accent);
      margin-bottom: 18px;
    }
    .section-title {
      font-size: clamp(30px, 4.4vw, 60px); font-weight: 800;
      letter-spacing: -0.025em; line-height: 1.04;
    }
    .section { padding: clamp(80px, 13vh, 170px) 0; }
    .section-head { max-width: 760px; margin-bottom: clamp(40px, 6vw, 78px); }
    .reveal { opacity: 0; transform: translateY(28px); transition: opacity .8s ease, transform .8s ease; }
    .reveal.visible { opacity: 1; transform: none; }

    /* ============================================================
       HERO —— 大字号编辑式 + metas 信息行 + 大幅视觉块
       ============================================================ */
    .hero {
      padding: clamp(140px, 20vh, 240px) 0 clamp(60px, 8vh, 110px);
    }
    .hero-grid {
      display: grid; grid-template-columns: 1.05fr .95fr; gap: clamp(32px, 5vw, 80px);
      align-items: center;
    }
    .hero-kicker {
      display: inline-block; font-size: 12px; font-weight: 700;
      letter-spacing: .2em; text-transform: uppercase; color: var(--accent);
      border: 1px solid var(--accent); border-radius: 100px; padding: 7px 16px; margin-bottom: 28px;
    }
    #heroTitle {
      font-size: clamp(46px, 8.5vw, 116px); font-weight: 800;
      letter-spacing: -0.035em; line-height: 0.98; margin-bottom: 26px;
    }
    #heroTitle .accent { color: var(--accent); }
    .intro {
      font-size: clamp(16px, 1.6vw, 20px); color: var(--text-soft);
      max-width: 520px; line-height: 1.55; margin-bottom: 44px;
    }

    /* metas 信息行（the-brandidentity 标志性装置） */
    .metas {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
      background: var(--line); border: 1px solid var(--line); border-radius: 4px; overflow: hidden;
    }
    .meta { background: var(--bg); padding: 18px 20px; }
    .meta-k {
      display: block; font-size: 11px; font-weight: 700; letter-spacing: .14em;
      text-transform: uppercase; color: var(--text-faint); margin-bottom: 8px;
    }
    .meta-v { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }

    /* 视觉块 */
    .hero-visual { position: relative; }
    .hero-photo {
      aspect-ratio: 4 / 5; border-radius: 6px; overflow: hidden;
      background: linear-gradient(150deg, #ff6a6a, #b76341 55%, #b3845d);
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(90px, 14vw, 180px); font-weight: 800; color: rgba(255,255,255,.92);
      box-shadow: 0 30px 70px -30px rgba(183,99,65,.6);
    }
    .hero-chips {
      position: absolute; right: -14px; bottom: -22px; display: flex; flex-wrap: wrap;
      gap: 10px; max-width: 70%;
    }
    .hero-chips span {
      background: var(--surface); border: 1px solid var(--line); border-radius: 100px;
      width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;
      font-size: 22px; box-shadow: 0 14px 30px -16px rgba(0,0,0,.35);
    }

    /* ============================================================
       ABOUT —— 左标签(粘性)右正文 编辑两栏
       ============================================================ */
    .about-grid {
      display: grid; grid-template-columns: .8fr 1.2fr; gap: clamp(36px, 6vw, 96px);
      align-items: start;
    }
    .about-aside { position: sticky; top: 120px; }
    .about-portrait {
      width: 92px; height: 92px; border-radius: 50%; margin-bottom: 28px;
      background: linear-gradient(150deg, #5bbad5, #6a83a6);
      display: flex; align-items: center; justify-content: center;
      font-size: 38px; font-weight: 800; color: #fff;
    }
    .about-stats { display: flex; flex-direction: column; gap: 0; }
    .stat-item {
      display: flex; align-items: baseline; gap: 14px; padding: 16px 0;
      border-top: 1px solid var(--line);
    }
    .stat-item:last-child { border-bottom: 1px solid var(--line); }
    .stat-item .num { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; min-width: 78px; }
    .stat-item .label { font-size: 14px; color: var(--text-soft); }
    .about-text p { font-size: clamp(17px, 1.7vw, 21px); color: var(--text); margin-bottom: 22px; line-height: 1.7; }
    .about-text strong { font-weight: 700; }
    .about-stats-inline { display: none; }

    /* ============================================================
       WORK —— 图注式作品网格（figure + caption）
       ============================================================ */
    .projects-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: clamp(28px, 4vw, 56px);
    }
    .project-card { cursor: default; }
    .project-thumb {
      position: relative; aspect-ratio: 16 / 11; border-radius: 6px; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(50px, 7vw, 88px); color: rgba(255,255,255,.92);
      transition: transform .5s cubic-bezier(.2,.7,.2,1);
    }
    .project-card:hover .project-thumb { transform: scale(1.03); }
    .project-index {
      position: absolute; top: 16px; left: 18px; font-size: 13px; font-weight: 700;
      letter-spacing: .1em; color: rgba(255,255,255,.95);
      background: rgba(0,0,0,.22); padding: 5px 11px; border-radius: 100px; backdrop-filter: blur(4px);
    }
    .project-body { padding: 22px 2px 0; }
    .project-body h3 { font-size: clamp(20px, 2vw, 26px); font-weight: 800; letter-spacing: -0.02em; margin-bottom: 10px; }
    .project-body p { font-size: 15px; color: var(--text-soft); margin-bottom: 16px; line-height: 1.65; }
    .project-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .project-tags .tag {
      font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--text-soft);
      border: 1px solid var(--line); border-radius: 100px; padding: 5px 12px;
    }

    /* ============================================================
       SKILLS —— 干净行式卡片
       ============================================================ */
    .skills-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    .skill-card { background: var(--bg); padding: clamp(24px, 3vw, 38px); }
    .skill-head { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
    .skill-icon {
      width: 48px; height: 48px; border-radius: 10px; flex: none;
      background: var(--surface); border: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center; font-size: 22px;
    }
    .skill-meta { display: flex; align-items: baseline; justify-content: space-between; width: 100%; gap: 12px; }
    .skill-meta h3 { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
    .skill-pct { font-size: 14px; font-weight: 700; color: var(--accent); }
    .skill-card p { font-size: 14px; color: var(--text-soft); margin-bottom: 18px; line-height: 1.6; }
    .skill-bar { height: 4px; background: var(--line); border-radius: 100px; overflow: hidden; }
    .skill-bar-fill { height: 100%; width: 0; background: var(--accent); border-radius: 100px; transition: width 1.2s cubic-bezier(.2,.7,.2,1); }

    /* ============================================================
       CONTACT —— 大字号编辑式
       ============================================================ */
    .contact { text-align: left; }
    #contactTitle { font-size: clamp(38px, 7vw, 96px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.0; margin-bottom: 28px; }
    #contactTitle .accent { color: var(--accent); }
    #contactDesc { font-size: clamp(16px, 1.6vw, 20px); color: var(--text-soft); max-width: 560px; margin-bottom: 40px; }
    .contact-links { display: flex; flex-wrap: wrap; gap: 14px; }
    .contact-link {
      font-size: 15px; font-weight: 600; padding: 13px 24px; border-radius: 100px;
      border: 1px solid var(--text); transition: background .3s ease, color .3s ease;
    }
    .contact-link:hover { background: var(--text); color: var(--bg); }

    /* ============================================================
       FOOTER
       ============================================================ */
    footer {
      border-top: 1px solid var(--line); padding: clamp(48px, 7vw, 90px) 0;
    }
    footer .wrap { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
    .footer-mark { font-size: clamp(28px, 5vw, 56px); font-weight: 800; letter-spacing: -0.03em; }
    .footer-mark .accent { color: var(--accent); }
    #footerText { font-size: 13px; color: var(--text-faint); letter-spacing: .02em; }

    /* ============================================================
       加载 & 演示横幅
       ============================================================ */
    .loader {
      position: fixed; inset: 0; background: var(--bg); z-index: 300;
      display: flex; align-items: center; justify-content: center; transition: opacity .5s ease;
    }
    .loader.hidden { opacity: 0; pointer-events: none; }
    .loader .spinner {
      width: 38px; height: 38px; border: 3px solid var(--line); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .demo-banner {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      background: var(--accent); color: #fff; font-size: 13px; font-weight: 600;
      padding: 11px 20px; border-radius: 100px; z-index: 250; box-shadow: 0 12px 30px -12px rgba(255,106,106,.6);
      max-width: 92vw; text-align: center;
    }

    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 100px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    ::selection { background: var(--accent); color: #fff; }

    /* ============================================================
       响应式
       ============================================================ */
    @media (max-width: 900px) {
      .hero-grid { grid-template-columns: 1fr; gap: 48px; }
      .hero-visual { max-width: 420px; }
      .about-grid { grid-template-columns: 1fr; gap: 40px; }
      .about-aside { position: static; }
      .about-stats { display: none; }
      .about-stats-inline { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 32px; }
      .about-stats-inline .stat-item { border: none; padding: 0; flex-direction: column; gap: 2px; }
      .projects-grid { grid-template-columns: 1fr; }
      .skills-grid { grid-template-columns: 1fr; }
      .metas { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 640px) {
      .nav-links {
        position: absolute; top: 100%; right: var(--pad); left: var(--pad);
        flex-direction: column; align-items: flex-start; gap: 18px;
        background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
        padding: 22px; transform: translateY(-10px); opacity: 0; pointer-events: none; transition: .3s;
      }
      .nav-links.open { transform: none; opacity: 1; pointer-events: auto; }
      .nav-toggle { display: flex; }
      .metas { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>

    // 参考页暖色系（用于作品缩略图，统一色调）
    const WARM_THUMBS = [
      'linear-gradient(140deg, #ff6a6a, #b76341)',
      'linear-gradient(140deg, #5bbad5, #6a83a6)',
      'linear-gradient(140deg, #c3c5bc, #40451b)',
      'linear-gradient(140deg, #b3845d, #ff6a6a)',
      'linear-gradient(140deg, #5bbad5, #c3c5bc)',
      'linear-gradient(140deg, #b76341, #40451b)'
    ];

    // ===== 工具函数 =====
    function renderBold(text) {
      return text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    }
    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ===== 渲染函数 =====
    function renderContent(data) {
      const s = data.settings;

      document.getElementById('navLogo').textContent = (s.heroName || 'Portfolio') + '.';
      document.getElementById('heroBadge').textContent = s.statusBadge || '正在寻找新的合作机会';
      document.getElementById('heroTitle').innerHTML =
        `你好，我是<span class="accent">${escapeHtml(s.heroName || '')}</span><br>我是一名${escapeHtml(s.heroRole || '')}`;
      document.getElementById('heroSubtitle').textContent = s.heroTagline || '';

      document.getElementById('heroAvatar').textContent = s.avatarLetter || 'Y';
      document.getElementById('heroRoleName').textContent = s.heroRole || '产品设计师';

      document.getElementById('aboutTitle').textContent = s.aboutTitle || '一点点自我介绍';
      const aboutTextEl = document.getElementById('aboutText');
      aboutTextEl.innerHTML = '';
      (s.aboutParagraphs || []).forEach(p => {
        const pEl = document.createElement('p');
        pEl.innerHTML = renderBold(escapeHtml(p));
        aboutTextEl.appendChild(pEl);
      });
      document.getElementById('aboutAvatar').textContent = s.avatarLetter || 'Y';
      document.getElementById('aboutName').textContent = s.heroName || '你的名字';
      document.getElementById('aboutRole').textContent = s.heroRole || '产品设计师';

      // Stats（hero meta + about card 两处）
      const statsHtml = (s.stats || []).map(stat => `
        <div class="stat-item">
          <div class="num">${escapeHtml(stat.num)}</div>
          <div class="label">${escapeHtml(stat.label)}</div>
        </div>`).join('');
      document.getElementById('aboutStats').innerHTML = statsHtml;
      document.getElementById('aboutStatsCard').innerHTML = statsHtml;

      // Projects
      const projectsEl = document.getElementById('projectsGrid');
      projectsEl.innerHTML = '';
      (data.projects || []).forEach((project, i) => {
        const idx = String(i + 1).padStart(2, '0');
        const bg = WARM_THUMBS[i % WARM_THUMBS.length];
        const tagsHtml = (project.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');
        projectsEl.innerHTML += `
          <div class="project-card">
            <div class="project-thumb" style="background: ${bg};">
              <div class="project-index">${idx}</div>
              <span>${escapeHtml(project.icon || '🎨')}</span>
            </div>
            <div class="project-body">
              <h3>${escapeHtml(project.title)}</h3>
              <p>${escapeHtml(project.description)}</p>
              <div class="project-tags">${tagsHtml}</div>
            </div>
          </div>`;
      });

      // Skills
      const skillsEl = document.getElementById('skillsGrid');
      skillsEl.innerHTML = '';
      (data.skills || []).forEach(skill => {
        skillsEl.innerHTML += `
          <div class="skill-card">
            <div class="skill-head">
              <div class="skill-icon">${escapeHtml(skill.icon || '🎨')}</div>
              <div class="skill-meta">
                <h3>${escapeHtml(skill.title)}</h3>
                <span class="skill-pct">${skill.level || 80}%</span>
              </div>
            </div>
            <p>${escapeHtml(skill.description || '')}</p>
            <div class="skill-bar"><div class="skill-bar-fill" data-width="${skill.level || 80}%"></div></div>
          </div>`;
      });

      // Hero 浮动技能芯片（取前 3 个）
      const chipsEl = document.getElementById('heroChips');
      chipsEl.innerHTML = '';
      (data.skills || []).slice(0, 3).forEach(skill => {
        chipsEl.innerHTML += `<span>${escapeHtml(skill.icon || '🎨')}</span>`;
      });

      // Contact
      document.getElementById('contactTitle').textContent = s.contactTitle || '有项目想聊聊？';
      document.getElementById('contactDesc').textContent = s.contactDesc || '';
      const contactEl = document.getElementById('contactLinks');
      contactEl.innerHTML = '';
      (s.contactLinks || []).forEach(link => {
        contactEl.innerHTML += `
          <a href="${escapeHtml(link.url || '#')}" class="contact-link">${escapeHtml(link.icon || '')} ${escapeHtml(link.label || '')}</a>`;
      });

      document.getElementById('footerText').textContent = s.footerText || '© 2026 · 用心设计，持续迭代';

      initAnimations();
    }

    function initAnimations() {
      const progress = document.getElementById('scrollProgress');
      const navbar = document.getElementById('navbar');
      function onScroll() {
        const h = document.documentElement.scrollHeight - window.innerHeight;
        const pct = h > 0 ? (window.scrollY / h) * 100 : 0;
        progress.style.width = pct + '%';
        navbar.classList.toggle('scrolled', window.scrollY > 30);
      }
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();

      const navToggle = document.getElementById('navToggle');
      const navLinks = document.getElementById('navLinks');
      navToggle.addEventListener('click', () => navLinks.classList.toggle('open'));
      navLinks.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => navLinks.classList.remove('open'));
      });

      const revealObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            entry.target.querySelectorAll('.skill-bar-fill').forEach(bar => {
              bar.style.width = bar.dataset.width;
            });
          }
        });
      }, { threshold: 0.12 });
      document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));
    }

    function hideLoader() {
      const loader = document.getElementById('loader');
      loader.classList.add('hidden');
      setTimeout(() => loader.remove(), 500);
    }

    async function init() {
      if (SANITY_PROJECT_ID === 'YOUR_PROJECT_ID') {
        renderContent(DEMO_DATA);
        hideLoader();
        const banner = document.createElement('div');
        banner.className = 'demo-banner';
        banner.innerHTML = '⚠️ 当前为演示数据 · 在 index.html 中配置 Sanity Project ID 后生效';
        document.body.appendChild(banner);
        return;
      }
      try {
        const { createClient } = await import('https://esm.sh/@sanity/client@6.22.2');
        const client = createClient({
          projectId: SANITY_PROJECT_ID,
          dataset: SANITY_DATASET,
          apiVersion: SANITY_API_VERSION,
          useCdn: true,
        });
        const [settings, projects, skills] = await Promise.all([
          client.fetch('*[_type == "siteSettings"][0]'),
          client.fetch('*[_type == "project"] | order(order asc) { title, description, icon, gradient, tags, order }'),
          client.fetch('*[_type == "skill"] | order(order asc) { title, description, icon, level, order }'),
        ]);
        const data = {
          settings: { ...DEMO_DATA.settings, ...settings },
          projects: (projects && projects.length > 0) ? projects : DEMO_DATA.projects,
          skills: (skills && skills.length > 0) ? skills : DEMO_DATA.skills,
        };
        renderContent(data);
      } catch (err) {
        console.warn('Sanity 连接失败，使用演示数据:', err.message);
        renderContent(DEMO_DATA);
        const banner = document.createElement('div');
        banner.className = 'demo-banner';
        banner.innerHTML = '⚠️ Sanity 连接失败，当前为演示数据 · 请检查 Project ID 和 CORS 配置';
        document.body.appendChild(banner);
      } finally {
        hideLoader();
      }
    }
    init();
  </script>
</body>
</html>
