<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Case · Brand &amp; Visual Design</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --bg-2: #141414;
      --line: #2a2a2a;
      --text: #f5f5f3;
      --text-soft: #a8a8a0;
      --text-faint: #6a6a64;
      --accent: #ff6a6a;
      --max-width: 1320px;
      --pad: clamp(20px, 5vw, 56px);
      --font-site: "Helvetica Neue", "Inter", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      --font-serif: "Cormorant Garamond", "Times New Roman", "Songti SC", "宋体", serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--bg); }
    body { background: var(--bg); color: var(--text); font-family: var(--font-site);
      -webkit-font-smoothing: antialiased; line-height: 1.6; overflow-x: hidden; }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    ::selection { background: var(--accent); color: var(--bg); }

    .top-bar, .bottom-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px var(--pad);
      font-size: 11px; font-weight: 600; letter-spacing: .22em;
      text-transform: uppercase; color: var(--text-soft);
      border-bottom: 1px solid var(--line);
    }
    .bottom-bar { border-bottom: none; border-top: 1px solid var(--line); }

    .wrap { max-width: var(--max-width); margin: 0 auto; padding: 0 var(--pad); }

    /* 返回链接 */
    .back-link {
      display: inline-flex; align-items: center; gap: 8px; margin-top: 60px;
      font-size: 11px; font-weight: 700; letter-spacing: .22em;
      text-transform: uppercase; color: var(--text-soft);
      transition: color .25s ease, gap .25s ease;
    }
    .back-link:hover { color: var(--accent); gap: 14px; }

    /* HERO */
    .case-hero { padding: 60px 0 80px; position: relative; overflow: hidden; }
    .case-hero .num {
      font-family: var(--font-serif); font-size: clamp(120px, 22vw, 320px);
      font-weight: 700; font-style: italic;
      color: rgba(255,255,255,.04);
      position: absolute; right: 30px; top: 30px; line-height: 1;
      pointer-events: none; user-select: none;
    }
    .case-hero .eyebrow {
      display: inline-block; font-size: 11px; font-weight: 700;
      letter-spacing: .28em; text-transform: uppercase; color: var(--accent);
      margin-bottom: 24px;
    }
    .case-hero h1 {
      font-size: clamp(48px, 9vw, 140px); font-weight: 800;
      letter-spacing: -0.04em; line-height: 0.95; margin-bottom: 28px;
    }
    .case-hero .lede {
      font-size: clamp(16px, 1.8vw, 23px); color: var(--text-soft);
      max-width: 720px; line-height: 1.6;
    }

    /* 信息行 */
    .metas {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
      background: var(--line); border: 1px solid var(--line);
      border-radius: 4px; overflow: hidden;
      margin: 40px 0 80px;
    }
    .meta { background: var(--bg); padding: 18px 20px; }
    .meta-k { display: block; font-size: 10px; font-weight: 700; letter-spacing: .22em;
      text-transform: uppercase; color: var(--text-faint); margin-bottom: 8px; }
    .meta-v { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }

    /* 封面 */
    .case-cover {
      aspect-ratio: 16 / 9; border-radius: 4px; overflow: hidden;
      background: var(--bg-2);
      margin-bottom: clamp(60px, 9vw, 120px);
    }
    .case-cover img { width: 100%; height: 100%; object-fit: cover; }

    /* Overview */
    .case-overview {
      display: grid; grid-template-columns: .8fr 1.2fr;
      gap: clamp(36px, 6vw, 96px); padding-bottom: clamp(60px, 9vw, 120px);
      border-bottom: 1px solid var(--line); margin-bottom: 80px;
    }
    .case-overview .label {
      font-size: 11px; font-weight: 700; letter-spacing: .28em;
      text-transform: uppercase; color: var(--accent);
    }
    .case-overview .body p {
      font-size: clamp(17px, 1.8vw, 22px); color: var(--text);
      margin-bottom: 22px; line-height: 1.7;
    }
    .case-overview .body strong { font-weight: 700; }

    /* 图组 */
    .case-figures {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: clamp(28px, 4vw, 56px);
      padding-bottom: clamp(80px, 12vh, 160px);
    }
    .case-figure { border-radius: 4px; overflow: hidden; background: var(--bg-2); }
    .case-figure img { width: 100%; height: auto; display: block; }
    .case-figure .cap {
      font-size: 11px; color: var(--text-faint); letter-spacing: .12em;
      text-transform: uppercase; padding: 14px 4px 0;
      display: flex; justify-content: space-between;
    }
    .case-figure.full { grid-column: 1 / -1; }

    /* 下一个项目 */
    .case-next { border-top: 1px solid var(--line); padding: clamp(60px, 9vh, 120px) 0; }
    .case-next a {
      display: grid; grid-template-columns: auto 1fr auto; align-items: baseline; gap: 24px;
      transition: color .25s ease;
    }
    .case-next a:hover { color: var(--accent); }
    .case-next .k {
      font-size: 11px; font-weight: 700; letter-spacing: .28em;
      text-transform: uppercase; color: var(--text-faint);
    }
    .case-next .t {
      font-size: clamp(36px, 6vw, 88px); font-weight: 800;
      letter-spacing: -0.03em;
    }
    .case-next .en {
      font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
      color: var(--text-faint);
    }

    @media (max-width: 900px) {
      .metas { grid-template-columns: repeat(2, 1fr); }
      .case-overview { grid-template-columns: 1fr; gap: 24px; }
      .case-figures { grid-template-columns: 1fr; }
      .case-next a { grid-template-columns: 1fr; gap: 8px; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <span>@Design Catalog</span>
    <span>Brand &amp; Visual Design</span>
  </div>

  <main class="wrap">
    <a href="index.html" class="back-link">← 返回目录</a>

    <header class="case-hero">
      <span class="num" id="caseNum">01</span>
      <span class="eyebrow" id="caseEyebrow">Case Study</span>
      <h1 id="caseTitle">加载中...</h1>
      <p class="lede" id="caseLede"></p>
    </header>

    <div class="metas" id="caseMetas"></div>

    <div class="case-cover" id="caseCover"></div>

    <section class="case-overview">
      <div class="label">Overview · 项目概述</div>
      <div class="body" id="caseOverview"></div>
    </section>

    <section class="case-figures" id="caseFigures"></section>

    <section class="case-next">
      <a href="#" id="caseNext">
        <span class="k">下一个项目 →</span>
        <span class="t" id="caseNextTitle"></span>
        <span class="en" id="caseNextEn"></span>
      </a>
    </section>
  </main>

  <div class="bottom-bar">
    <span id="footerText">© 2025 · Brand &amp; Visual Design</span>
    <span>Lijinshan Portfolio</span>
  </div>

  <script type="module">
    // 与 index.html 保持一致的本地默认
    const LOCAL_SECTIONS = [
      {
        slug: 'brand', num: '01', title: '品牌设计', en: 'Brand Design',
        desc: '从品牌定位、视觉语言到落地物料的完整品牌体系设计。',
        tags: ['LOGO','VI','字体','辅助图形'], year: '2025',
        cover: 'images/01_brand/p02_img08_7632bb9a.webp',
        gallery: [
          'images/01_brand/p02_img07_b6d2fdf0.webp',
          'images/01_brand/p02_img05_74e57ae1.webp',
          'images/01_brand/p02_img06_d159f940.webp',
          'images/01_brand/p01_img01_aab024af.webp'
        ]
      },
      {
        slug: 'kv', num: '02', title: '主视觉 KV', en: 'Main Visual KV',
        desc: '产品发布会主视觉、电商详情页、传播海报。围绕产品核心卖点的视觉锤与延展系统。',
        tags: ['主视觉','KV','电商','延展'], year: '2025',
        cover: 'images/02_kv/p11_img02_dc8c69ee.webp',
        gallery: [
          'images/02_kv/p10_img02_591f9536.webp',
          'images/02_kv/p10_img04_d5dcbd36.webp',
          'images/02_kv/p10_img05_283a91a8.webp',
          'images/02_kv/p11_img05_990165b5.webp',
          'images/02_kv/p11_img04_15f01808.webp'
        ]
      },
      {
        slug: 'visual', num: '03', title: '视觉 & 版式', en: 'Visual & Layout',
        desc: '包装设计、节庆礼盒、品牌活动推广物料。从 0-1 全流程包装设计到延展物料。',
        tags: ['包装','礼盒','活动','排版'], year: '2025',
        cover: 'images/03_visual/p03_img02_544eb040.webp',
        gallery: [
          'images/03_visual/p03_img03_7766e262.webp',
          'images/03_visual/p03_img05_b384cc2d.webp',
          'images/03_visual/p03_img07_c1a387af.webp',
          'images/03_visual/p04_img04_93e0c765.webp',
          'images/03_visual/p04_img05_ecce3855.webp',
          'images/03_visual/p05_img01_77a33cd4.webp',
          'images/03_visual/p06_img01_623229af.webp',
          'images/03_visual/p08_img01_fd922c3b.webp'
        ]
      },
      {
        slug: 'font', num: '04', title: '字体设计', en: 'Font Design',
        desc: '中英体字字体设计与商业字库应用。兼顾屏幕显示与印刷质感。',
        tags: ['中文','英文','字库'], year: '2025',
        cover: 'images/04_font/p13_img03_57f77ee3.webp',
        gallery: [
          'images/04_font/p13_img02_360df3ad.webp',
          'images/04_font/p13_img01_13ffd8e0.webp'
        ]
      }
    ];

    function escapeHtml(s){ if(!s) return ''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
    function renderBold(t){ return t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }

    function renderCase(sections, idx){
      if (idx >= sections.length) idx = 0;
      const s = sections[idx];

      document.title = s.title + ' · ' + s.en + ' · Portfolio';
      document.getElementById('caseNum').textContent = s.num;
      document.getElementById('caseEyebrow').textContent = s.en + ' / Case Study';
      document.getElementById('caseTitle').textContent = s.title;
      document.getElementById('caseLede').textContent = s.desc;

      const metas = [
        { k: '板块', v: s.title },
        { k: '类别', v: s.en },
        { k: '年份', v: s.year || '2025' },
        { k: '状态', v: '已发布' }
      ];
      document.getElementById('caseMetas').innerHTML = metas.map(m =>
        `<div class="meta"><span class="meta-k">${escapeHtml(m.k)}</span><span class="meta-v">${escapeHtml(m.v)}</span></div>`
      ).join('');

      const coverEl = document.getElementById('caseCover');
      coverEl.innerHTML = `<img src="${s.cover}" alt="${escapeHtml(s.title)}" />`;

      const overview = document.getElementById('caseOverview');
      overview.innerHTML = `<p>${renderBold(escapeHtml(s.desc))}</p>` +
        (s.tags && s.tags.length ? `<p>关键词：${s.tags.map(t=>`<strong>${escapeHtml(t)}</strong>`).join(' · ')}</p>` : '');

      const figs = document.getElementById('caseFigures');
      figs.innerHTML = '';
      (s.gallery || []).forEach((src, i) => {
        const isFull = (i % 5 === 0);
        figs.innerHTML += `
          <figure class="case-figure ${isFull ? 'full' : ''}">
            <img src="${src}" alt="${escapeHtml(s.title)} - 图 ${i+1}" loading="lazy" />
            <figcaption class="cap"><span>${escapeHtml(s.title)}</span><span>${String(i+1).padStart(2,'0')}</span></figcaption>
          </figure>`;
      });

      const nextIdx = (idx + 1) % sections.length;
      const next = sections[nextIdx];
      document.getElementById('caseNext').setAttribute('href', `project.html?i=${nextIdx}`);
      document.getElementById('caseNextTitle').textContent = next.title;
      document.getElementById('caseNextEn').textContent = next.en;
    }

    async function init(){
      const params = new URLSearchParams(location.search);
      let idx = parseInt(params.get('i') || '0', 10);
      if (isNaN(idx) || idx < 0) idx = 0;

      let sections = LOCAL_SECTIONS;
      try {
        const { createClient } = await import('https://esm.sh/@sanity/client@6.22.2');
        const client = createClient({ projectId: '4i3qoqt0', dataset: 'production', apiVersion: '2024-01-01', useCdn: true });
        const data = await client.fetch(`*[_type == "siteSettings"][0]{
          works[]{ image{asset->{url}}, gallery[]{asset->{url}}, title, description, tags }
        }`);
        if (data && data.works && data.works.length){
          sections = data.works.map((w, i) => {
            const local = LOCAL_SECTIONS[i] || LOCAL_SECTIONS[0];
            const cover = (w.image && w.image.asset && w.image.asset.url) ? (w.image.asset.url + '?w=1400&q=80&auto=format') : local.cover;
            const gallery = (w.gallery && w.gallery.length)
              ? w.gallery.map(g => (g.asset && g.asset.url) ? (g.asset.url + '?w=1400&q=80&auto=format') : '').filter(Boolean)
              : local.gallery;
            return {
              slug: local.slug, num: local.num,
              title: w.title || local.title,
              en: local.en, desc: w.description || local.desc,
              tags: w.tags || local.tags, year: '2025',
              cover, gallery
            };
          });
        }
      } catch (err){
        console.warn('Sanity 拉取失败，使用本地默认：', err.message);
      }

      renderCase(sections, idx);
    }
    init();
  </script>
</body>
</html>
